<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Glow Touch Booking</title>

<style>
body{
  font-family: Arial;
  background:#ffe6f0;
  text-align:center;
  padding:40px;
}

.container{
  background:white;
  padding:30px;
  max-width:500px;
  margin:auto;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  background:#ff66a3;
  color:white;
  border:none;
  padding:15px;
  width:100%;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

.status{
  font-weight:bold;
  margin:10px;
  color:#ff3399;
}
</style>
</head>

<body>

<div class="container">
<h1>🌸 Glow Touch Booking</h1>

<form id="bookingForm">

<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>

<label>Pick a Date 📅</label>
<input type="date" id="datePicker" required>

<div id="availability" class="status"></div>

<input type="text" id="timeSlot" readonly placeholder="Auto-selected time">

<select id="service" required>
<option value="">Select Service</option>
<option>Hair Care</option>
<option>Skincare</option>
<option>Makeup</option>
<option>Manicure/Pedicure</option>
<option>Massage</option>
<option>Nail Painting</option>
<option>Hairstyling</option>
<option>Glow Touch Premium</option>
</select>

<textarea id="notes" placeholder="Tell us your preferences 💖" required></textarea>

<label>
<input type="checkbox" id="agreeRules"> I agree to booking rules 💖
</label>

<button id="submitBtn" type="submit">Book Appointment 💌</button>

</form>
</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("aYulFPHFq_V9fhxKe");

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyDEt-You1wAndEqcSANbfByBC1Tja1LCt5kCYf-B2INOM0Q2xwW_rRIFmeDhbfg5el/exec";

/* 🌸 SCHEDULE */
const weeklySchedule = {
  0: ["14:00 – 15:30"],
  1: ["17:30 – 19:00"],
  2: [],
  3: [],
  4: ["17:30 – 19:00"],
  5: [],
  6: ["17:30 – 19:00"]
};

const datePicker=document.getElementById("datePicker");
const timeSlot=document.getElementById("timeSlot");
const availability=document.getElementById("availability");
const submitBtn=document.getElementById("submitBtn");

let isSubmitting = false;

/* ⏱ SAFE FETCH WITH TIMEOUT */
async function safeFetch(url, options = {}, timeout = 8000){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);

  try{
    const res = await fetch(url, {
      ...options,
      signal: controller.signal
    });
    clearTimeout(id);
    return res;
  }catch(err){
    clearTimeout(id);
    throw err;
  }
}

/* 🔥 AUTO TIME */
function setTime(dateStr){

  const date = new Date(dateStr);
  const day = date.getDay();

  const slots = weeklySchedule[day];

  if(!slots || slots.length === 0){
    availability.textContent = "No appointments available 😢";
    timeSlot.value = "";
    return false;
  }

  timeSlot.value = slots[0];
  availability.textContent = "Time auto-selected 💖 " + slots[0];
  return true;
}

datePicker.addEventListener("change", function(){
  setTime(this.value);
});


/* 🚀 SUBMIT */
document.getElementById("bookingForm").addEventListener("submit", async function(e){

  e.preventDefault();

  if(isSubmitting){
    alert("Already submitting... wait 💖");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const date = document.getElementById("datePicker").value;
  const time = timeSlot.value;
  const service = document.getElementById("service").value;
  const notes = document.getElementById("notes").value.trim();
  const agreed = document.getElementById("agreeRules").checked;

  if(!name || !email || !date || !time || !service || !notes || !agreed){
    alert("Complete all fields 🌸");
    return;
  }

  isSubmitting = true;
  submitBtn.disabled = true;

  try{

    const data = new URLSearchParams();
    data.append("name", name);
    data.append("email", email);
    data.append("date", date);
    data.append("time", time);
    data.append("service", service);
    data.append("notes", notes);

    const res = await safeFetch(SCRIPT_URL, {
      method: "POST",
      body: data
    });

    if(!res){
      throw new Error("No response from server");
    }

    const text = await res.text();

    if(!text){
      throw new Error("Empty server response");
    }

    /* 🔒 DOUBLE BOOKING */
    if(text.trim() === "TAKEN"){
      alert("❌ Slot already booked!");
      setTime(date);
      return;
    }

    if(text.trim() !== "OK"){
      throw new Error(text);
    }

    /* 📧 EMAIL */
    await emailjs.send(
      "service_h4xpaqh",
      "template_tgosttk",
      { name, email, date, time, service, notes }
    );

    alert("Booking confirmed! 🌸💌");

    document.getElementById("bookingForm").reset();
    availability.textContent = "";
    timeSlot.value = "";

  }catch(err){
    console.error("BOOKING ERROR:", err);
    alert("Booking failed 😢 Try again or check server");

  }finally{
    isSubmitting = false;
    submitBtn.disabled = false;
  }

});
</script>

</body>
</html>
