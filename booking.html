<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Glow Touch Booking</title>

<style>
body{
  font-family: Arial;
  background:#ffe6f0;
  text-align:center;
  padding:40px;
}

.container{
  background:white;
  padding:30px;
  max-width:500px;
  margin:auto;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  background:#ff66a3;
  color:white;
  border:none;
  padding:15px;
  width:100%;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}

.status{
  font-weight:bold;
  margin:10px;
  color:#ff3399;
}
</style>
</head>

<body>

<div class="container">
<h1>🌸 Glow Touch Booking</h1>

<form id="bookingForm">

<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>

<label>Pick a Date 📅</label>
<input type="date" id="datePicker" required>

<div id="availability" class="status"></div>

<select id="timeSlot" required>
<option value="">Select time</option>
</select>

<select id="service" required>
<option value="">Select Service</option>
<option>Hair Care</option>
<option>Skincare</option>
<option>Makeup</option>
<option>Manicure/Pedicure</option>
<option>Massage</option>
<option>Nail Painting</option>
<option>Hairstyling</option>
<option>Glow Touch Premium</option>
</select>

<textarea id="notes" placeholder="Tell us your preferences 💖" required></textarea>

<label>
<input type="checkbox" id="agreeRules"> I agree to booking rules 💖
</label>

<button type="submit">Book Appointment 💌</button>

</form>
</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("aYulFPHFq_V9fhxKe");

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyDEt-You1wAndEqcSANbfByBC1Tja1LCt5kCYf-B2INOM0Q2xwW_rRIFmeDhbfg5el/exec";
const datePicker=document.getElementById("datePicker");
const timeSlot=document.getElementById("timeSlot");
const availability=document.getElementById("availability");

/* LOAD AVAILABLE SLOTS */
async function loadSlots(date){

  const res = await fetch(SCRIPT_URL + "?date=" + date);
  const data = await res.json();

  timeSlot.innerHTML = `<option value="">Select time</option>`;

  if(data["14:00"]){
    timeSlot.innerHTML += `<option value="14:00">14:00 – 15:30</option>`;
  }

  if(data["17:30"]){
    timeSlot.innerHTML += `<option value="17:30">17:30 – 19:00</option>`;
  }

  if(timeSlot.options.length === 1){
    availability.textContent = "No slots available 😢";
  } else {
    availability.textContent = "Choose a time 💖";
  }
}

datePicker.addEventListener("change", function(){
  loadSlots(this.value);
});

/* SUBMIT BOOKING */
document.getElementById("bookingForm").addEventListener("submit", async function(e){

  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const date=document.getElementById("datePicker").value;
  const time=document.getElementById("timeSlot").value;
  const service=document.getElementById("service").value;
  const notes=document.getElementById("notes").value.trim();
  const agreed=document.getElementById("agreeRules").checked;

  if(!name || !email || !date || !time || !service || !notes || !agreed){
    alert("Complete all fields 🌸");
    return;
  }

  const data=new URLSearchParams();
  data.append("name",name);
  data.append("email",email);
  data.append("date",date);
  data.append("time",time);
  data.append("service",service);
  data.append("notes",notes);

  try{

    const response = await fetch(SCRIPT_URL,{
      method:"POST",
      body:data
    });

    const text = await response.text();

    if(text === "TAKEN"){
      alert("❌ This slot was just booked by someone else!");
      loadSlots(date);
      return;
    }

    if(text !== "OK"){
      throw new Error(text);
    }

    await emailjs.send(
      "service_h4xpaqh",
      "template_tgosttk",
      { name, email, date, time, service, notes }
    );

    alert("Booking confirmed! 🌸💌");

    document.getElementById("bookingForm").reset();
    availability.textContent="";
    timeSlot.innerHTML="<option value=''>Select time</option>";

  }catch(error){
    console.error(error);
    alert("Booking failed 😢 (check console)");
  }

});
</script>

</body>
</html>
